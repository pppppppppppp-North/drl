project:
  name: regime_tests_real_ohlcv
  seed: 42

paths:
  raw_prices: data/raw/prices_real_ohlcv.csv
  features: data/processed/features_real_ohlcv.parquet
  fallback_features_csv: data/processed/features_real_ohlcv.csv
  results_dir: results/regime_tests_real_ohlcv
  models_dir: models/regime_tests_real_ohlcv

data:
  source: yahoo_ohlcv
  tickers: [PTT.BK, AOT.BK, CPALL.BK, KBANK.BK, ADVANC.BK]
  start: "2021-01-01"
  end: "2024-12-31"
  initial_price: 100.0

features:
  lookback: 30
  columns:
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - ma_ratio_10
    - ma_ratio_30
    - rsi_14
    - macd
    - bollinger_z
    - volume_ratio_20
    - market_return_1d
    - macro_rate_change
    - sentiment_score

environment:
  initial_cash: 1000000.0
  transaction_cost: 0.001
  reward:
    return_weight: 1.0
    turnover_penalty: 0.05
    drawdown_penalty: 0.1

regimes:
  slices:
    - name: covid_crash_unavailable
      start: "2020-02-01"
      end: "2020-04-30"
      note: "Current starter OHLCV data begins in 2021, so acute COVID crash testing requires older data."
    - name: covid_recovery_2021
      start: "2021-01-04"
      end: "2021-12-30"
    - name: inflation_hike_drawdown_2022
      start: "2022-01-04"
      end: "2022-12-30"
    - name: validation_period
      start: "2023-05-30"
      end: "2024-03-12"
    - name: test_period
      start: "2024-03-13"
      end: "2024-12-30"
  auto_high_volatility:
    enabled: true
    window: 63
    top_n: 2
    min_gap: 63
  model_paths:
    - policy: ppo
      algo: ppo
      path: results/real_ohlcv_compare_2855/ppo_model.zip
    - policy: a2c
      algo: a2c
      path: results/real_ohlcv_compare_2855/a2c_model.zip
