# Sector inputs on the locked point-in-time design (milestones M4 and M6, RQ2/RQ3), 2026-11-27.
# The locked design is pit_plan_weekly_lstm_shared_cashcap of config/pit_walk_forward_experiment.yaml: the
# shared-weight actor, sticky slots, the 20% cash cap, and the stock technical inputs plus five SET50 ETF
# market inputs. This arm adds four stock-level inputs built from the dated SET sector of each half-year
# SET50/SET100 list in the official archive (src/features/pit_sector_context.py): the stock's 5- and 20-session
# return relative to its sector peers on that session's SET100 list, the peers' 20-session return, and a flag
# for having a peer. Nothing else changes. Data, splits, base settings and the rest of the variant are
# generated from pit_walk_forward_experiment.yaml and must stay identical to it
# (tests/test_pit_sector_ablation_config.py). It completes the leave-one-source-in arms of
# config/pit_source_ablation_cashcap.yaml (technical only, policy rate, macro proxies, all) with the one
# source the data already allow. Validation years 2016-2022 only: the sector labels come from the lists in
# force on each session, and the test years and the sealed holdout are never read. Every test and holdout
# result was already used once, so this arm informs the report's discussion of the sources; it cannot change
# the locked design or its results.
project:
  name: pit_sector_ablation_cashcap
  seed: 42
data:
  membership: data/reference/set50_set100_membership_2012_2024.csv
  price_map: data/raw/extended/set100_2012_2024_additions/member_price_map_2012_2024.csv
  prices:
  - data/raw/extended/prices_set100_union_2012_2024.csv.gz
  - data/raw/extended/set100_2012_2024_additions/prices_set100_2012_2024_additions.csv.gz
  index: data/raw/extended/index_set50_etf_2012_2024.csv
  index_name: set50_etf
  universe: set50
  sector: true
splits:
  validation_end: '2022-12-30'
universe:
  num_slots: 50
  min_history_sessions: 60
features:
  lookback: 30
  stock_columns:
  - return_1d
  - return_5d
  - return_20d
  - volatility_20d
  - ma_ratio_10
  - ma_ratio_30
  - rsi_14
  - macd
  - bollinger_z
  - atr_14
  - volume_ratio_20
  market_columns:
  - set50_etf_return_1d
  - set50_etf_return_5d
  - set50_etf_return_20d
  - set50_etf_volatility_20d
  - set50_etf_ma_ratio_20
base:
  environment:
    initial_cash: 1000000.0
    transaction_cost: 0.0015
    slippage: 0.0005
    rebalance_every: 5
    train_random_start: true
    train_episode_length: 504
    reward:
      type: plan_main
      sharpe_weight: 0.1
      sharpe_eta: 0.01
      drawdown_penalty: 0.5
      drawdown_mode: increment
      turnover_penalty: 0.0
      scale: 100.0
  training:
    algo: ppo
    total_timesteps: 100000
    gamma: 0.99
    normalize_observations: true
    verbose: 0
    policy:
      features_extractor: asset_lstm
      market_feature_columns:
      - set50_etf_return_1d
      - set50_etf_return_5d
      - set50_etf_return_20d
      - set50_etf_volatility_20d
      - set50_etf_ma_ratio_20
      hidden_size: 32
      fusion_size: 16
      net_arch:
      - 64
      - 64
seeds:
- 42
- 43
- 44
- 45
- 46
variants:
- name: pit_cashcap_src_sector
  description: Locked cash-capped design plus four sector-relative stock inputs from
    the archive's dated SET sectors
  environment:
    max_cash_weight: 0.2
  universe:
    slot_order: sticky
  training:
    normalize_observations: false
    policy:
      actor: shared_asset
  features:
    stock_columns:
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - ma_ratio_10
    - ma_ratio_30
    - rsi_14
    - macd
    - bollinger_z
    - atr_14
    - volume_ratio_20
    - sector_relative_return_5d
    - sector_relative_return_20d
    - sector_peer_return_20d
    - sector_peers_available
