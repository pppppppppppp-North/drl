# Source ablation on the locked point-in-time design (milestones M4 and M6, RQ2/RQ3), 2026-11-26.
# The locked design is pit_plan_weekly_lstm_shared_cashcap of config/pit_walk_forward_experiment.yaml: the
# shared-weight actor, sticky slots, the 20% cash cap, and the stock technical inputs plus five SET50 ETF
# market inputs. Each variant here changes only the market-level inputs:
#   pit_cashcap_src_technical  no market-level inputs (stock technical inputs only)
#   (locked design)            + SET50 ETF market inputs; its five seeds at 100k already exist
#   pit_cashcap_src_policy     + the official BOT policy-rate features (src/features/policy_rate_context.py)
#   pit_cashcap_src_macro      + the eight daily macro proxies (src/features/macro_context.py)
#   pit_cashcap_src_all        + both
# The earlier policy-rate and macro arms (2026-11-11) used the uncapped shared design with three seeds; this
# repeats them on the locked design with five seeds and adds the technical-only and all-sources arms, so the
# arms give both a cumulative ablation and leave-one-source-out comparisons. Data, splits, base settings and
# the rest of each variant are generated from pit_walk_forward_experiment.yaml and must stay identical to it
# (tests/test_pit_source_ablation_config.py). Validation years 2016-2022 only: policy-rate decisions and macro
# prices after splits.validation_end are dropped before the merge, and the test years and the sealed holdout
# are never read. Every test and holdout result was already used once, so these arms inform the report's
# discussion of the sources; they cannot change the locked design or its results.
project:
  name: pit_source_ablation_cashcap
  seed: 42
data:
  membership: data/reference/set50_set100_membership_2012_2024.csv
  price_map: data/raw/extended/set100_2012_2024_additions/member_price_map_2012_2024.csv
  prices:
  - data/raw/extended/prices_set100_union_2012_2024.csv.gz
  - data/raw/extended/set100_2012_2024_additions/prices_set100_2012_2024_additions.csv.gz
  index: data/raw/extended/index_set50_etf_2012_2024.csv
  index_name: set50_etf
  universe: set50
  policy_rate: data/external/bot_policy_rate_history.csv
  macro: data/raw/extended/macro_proxies_2012_2024.csv
  macro_names:
    USDTHB=X: usdthb
    BZ=F: brent
    CL=F: wti
    GC=F: gold
    ^TNX: us10y
splits:
  validation_end: '2022-12-30'
universe:
  num_slots: 50
  min_history_sessions: 60
features:
  lookback: 30
  stock_columns:
  - return_1d
  - return_5d
  - return_20d
  - volatility_20d
  - ma_ratio_10
  - ma_ratio_30
  - rsi_14
  - macd
  - bollinger_z
  - atr_14
  - volume_ratio_20
  market_columns:
  - set50_etf_return_1d
  - set50_etf_return_5d
  - set50_etf_return_20d
  - set50_etf_volatility_20d
  - set50_etf_ma_ratio_20
base:
  environment:
    initial_cash: 1000000.0
    transaction_cost: 0.0015
    slippage: 0.0005
    rebalance_every: 5
    train_random_start: true
    train_episode_length: 504
    reward:
      type: plan_main
      sharpe_weight: 0.1
      sharpe_eta: 0.01
      drawdown_penalty: 0.5
      drawdown_mode: increment
      turnover_penalty: 0.0
      scale: 100.0
  training:
    algo: ppo
    total_timesteps: 100000
    gamma: 0.99
    normalize_observations: true
    verbose: 0
    policy:
      features_extractor: asset_lstm
      market_feature_columns:
      - set50_etf_return_1d
      - set50_etf_return_5d
      - set50_etf_return_20d
      - set50_etf_volatility_20d
      - set50_etf_ma_ratio_20
      hidden_size: 32
      fusion_size: 16
      net_arch:
      - 64
      - 64
seeds:
- 42
- 43
- 44
- 45
- 46
variants:
- name: pit_cashcap_src_technical
  description: Locked cash-capped design with the stock technical inputs only (no market-level inputs)
  environment:
    max_cash_weight: 0.2
  universe:
    slot_order: sticky
  features:
    market_columns: []
  training:
    normalize_observations: false
    policy:
      actor: shared_asset
      market_feature_columns: []
- name: pit_cashcap_src_policy
  description: Locked cash-capped design plus the official BOT policy-rate features
  environment:
    max_cash_weight: 0.2
  universe:
    slot_order: sticky
  features:
    market_columns:
    - set50_etf_return_1d
    - set50_etf_return_5d
    - set50_etf_return_20d
    - set50_etf_volatility_20d
    - set50_etf_ma_ratio_20
    - bot_policy_rate
    - bot_policy_rate_change_1y
    - bot_last_change_bp
    - bot_years_since_change
    - bot_last_dissent_share
  training:
    normalize_observations: false
    policy:
      actor: shared_asset
      market_feature_columns:
      - set50_etf_return_1d
      - set50_etf_return_5d
      - set50_etf_return_20d
      - set50_etf_volatility_20d
      - set50_etf_ma_ratio_20
      - bot_policy_rate
      - bot_policy_rate_change_1y
      - bot_last_change_bp
      - bot_years_since_change
      - bot_last_dissent_share
- name: pit_cashcap_src_macro
  description: Locked cash-capped design plus the eight daily macro-proxy inputs
  environment:
    max_cash_weight: 0.2
  universe:
    slot_order: sticky
  features:
    market_columns:
    - set50_etf_return_1d
    - set50_etf_return_5d
    - set50_etf_return_20d
    - set50_etf_volatility_20d
    - set50_etf_ma_ratio_20
    - usdthb_return_5d
    - usdthb_return_20d
    - brent_return_5d
    - brent_return_20d
    - gold_return_5d
    - gold_return_20d
    - us10y_change_1d
    - us10y_return_20d
  training:
    normalize_observations: false
    policy:
      actor: shared_asset
      market_feature_columns:
      - set50_etf_return_1d
      - set50_etf_return_5d
      - set50_etf_return_20d
      - set50_etf_volatility_20d
      - set50_etf_ma_ratio_20
      - usdthb_return_5d
      - usdthb_return_20d
      - brent_return_5d
      - brent_return_20d
      - gold_return_5d
      - gold_return_20d
      - us10y_change_1d
      - us10y_return_20d
- name: pit_cashcap_src_all
  description: Locked cash-capped design plus the policy-rate and macro-proxy inputs
  environment:
    max_cash_weight: 0.2
  universe:
    slot_order: sticky
  features:
    market_columns:
    - set50_etf_return_1d
    - set50_etf_return_5d
    - set50_etf_return_20d
    - set50_etf_volatility_20d
    - set50_etf_ma_ratio_20
    - bot_policy_rate
    - bot_policy_rate_change_1y
    - bot_last_change_bp
    - bot_years_since_change
    - bot_last_dissent_share
    - usdthb_return_5d
    - usdthb_return_20d
    - brent_return_5d
    - brent_return_20d
    - gold_return_5d
    - gold_return_20d
    - us10y_change_1d
    - us10y_return_20d
  training:
    normalize_observations: false
    policy:
      actor: shared_asset
      market_feature_columns:
      - set50_etf_return_1d
      - set50_etf_return_5d
      - set50_etf_return_20d
      - set50_etf_volatility_20d
      - set50_etf_ma_ratio_20
      - bot_policy_rate
      - bot_policy_rate_change_1y
      - bot_last_change_bp
      - bot_years_since_change
      - bot_last_dissent_share
      - usdthb_return_5d
      - usdthb_return_20d
      - brent_return_5d
      - brent_return_20d
      - gold_return_5d
      - gold_return_20d
      - us10y_change_1d
      - us10y_return_20d
