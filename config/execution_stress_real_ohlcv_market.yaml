project:
  name: drl_thai_stock_execution_stress
  seed: 42

paths:
  raw_prices: data/raw/prices_real_ohlcv.csv
  features: data/processed/features_real_ohlcv_market.parquet
  fallback_features_csv: data/processed/features_real_ohlcv_market.csv
  results_dir: results/execution_stress_real_ohlcv_market
  models_dir: models/robustness_real_ohlcv_market

data:
  source: yahoo_ohlcv
  tickers: [PTT.BK, AOT.BK, CPALL.BK, KBANK.BK, ADVANC.BK]
  start: "2021-01-01"
  end: "2024-12-31"

features:
  lookback: 30
  columns:
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - ma_ratio_10
    - ma_ratio_30
    - rsi_14
    - macd
    - bollinger_z
    - volume_ratio_20
    - market_return_1d
    - set_return_1d
    - set_return_5d
    - set_return_20d
    - set_volatility_20d
    - set_ma_ratio_20
    - macro_rate_change
    - sentiment_score

splits:
  train_fraction: 0.6
  validation_fraction: 0.2

environment:
  initial_cash: 1000000.0
  transaction_cost: 0.001
  slippage: 0.0
  reward:
    return_weight: 1.0
    turnover_penalty: 0.05
    drawdown_penalty: 0.1

baselines:
  market_index:
    policy_name: set_index
    return_column: set_return_1d

execution_stress:
  require_models: false
  model_paths: []
  scenarios:
    - name: base
      transaction_cost: 0.001
      slippage: 0.0
    - name: moderate
      transaction_cost: 0.002
      slippage: 0.0005
    - name: conservative
      transaction_cost: 0.005
      slippage: 0.001
    - name: hostile
      transaction_cost: 0.01
      slippage: 0.002
    - name: constrained
      transaction_cost: 0.002
      slippage: 0.0005
      max_turnover: 0.5
      max_position_weight: 0.4
      min_cash_weight: 0.1
