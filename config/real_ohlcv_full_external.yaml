project:
  name: drl_thai_stock_real_ohlcv_full_external
  seed: 42

paths:
  raw_prices: data/raw/prices_real_ohlcv_full_external.csv
  base_features: data/processed/features_real_ohlcv_official_macro.parquet
  fallback_base_features_csv: data/processed/features_real_ohlcv_official_macro.csv
  features: data/processed/features_real_ohlcv_full_external.parquet
  fallback_features_csv: data/processed/features_real_ohlcv_full_external.csv
  results_dir: results/real_ohlcv_full_external
  models_dir: models/real_ohlcv_full_external

data:
  source: yahoo_ohlcv
  ticker_universe:
    path: data/reference/set50_or_set100_universe.csv
    column: ticker
  start: "2021-01-01"
  end: "2024-12-31"
  initial_price: 100.0

market_indices:
  primary: set
  raw_prices: data/raw/prices_market_indices.csv
  symbols:
    set: ^SET.BK

sector_context:
  mapping_path: data/reference/sector_mapping.csv
  source: external_sector_mapping

macro_context:
  raw_prices: data/raw/prices_macro_yahoo.csv
  primary_rate_column: us10y_change_1d
  symbols:
    usdthb: USDTHB=X
    brent: BZ=F
    wti: CL=F
    gold: GC=F
    us10y: ^TNX

fundamentals:
  raw_path: data/external/fundamentals.csv
  reporting_lag_days: 60
  source_detail: licensed_or_provider_fundamentals

official_macro_context:
  raw_path: data/raw/bot_historical_macro.csv
  release_rule: last_business_day_following_month
  metrics:
    leading_economic_index: bot_leading_economic_index
    index_change: bot_leading_index_change
    business_sentiment_index_3_months: bot_bsi_3m
    export_volume_index_exclude_gold: bot_export_volume_index_ex_gold
    broad_money_at_2000_prices_million_baht: bot_real_broad_money

sentiment:
  raw_news_path: data/raw/news_historical.csv
  daily_path: data/processed/sentiment_daily_external.parquet
  fallback_daily_csv: data/processed/sentiment_daily_external.csv
  max_age_days: 7
  model: airesearch/wangchanberta-base-att-spm-uncased
  source_detail: external_historical_news_or_sentiment

features:
  lookback: 30
  columns:
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - ma_ratio_10
    - ma_ratio_30
    - rsi_14
    - macd
    - bollinger_z
    - volume_ratio_20
    - market_return_1d
    - set_return_1d
    - set_return_5d
    - set_return_20d
    - set_volatility_20d
    - set_ma_ratio_20
    - sector_equal_weight_return_1d
    - sector_relative_return_1d
    - sector_peer_count
    - macro_rate_change
    - usdthb_return_1d
    - usdthb_return_5d
    - brent_return_1d
    - brent_return_5d
    - wti_return_1d
    - gold_return_1d
    - us10y_change_1d
    - fundamental_net_margin
    - fundamental_return_on_equity
    - fundamental_debt_to_equity
    - fundamental_fcf_margin
    - fundamental_revenue_growth_qoq
    - fundamental_assets_growth_qoq
    - bot_leading_economic_index
    - bot_leading_index_change
    - bot_bsi_3m
    - bot_export_volume_index_ex_gold
    - bot_real_broad_money
    - bot_macro_release_age_days
    - sentiment_score
    - news_count
    - sentiment_news_age_days

splits:
  train_fraction: 0.6
  validation_fraction: 0.2
  train_split: train
  eval_split: validation

walk_forward:
  train_window: 504
  validation_window: 126
  test_window: 126
  step_size: 126
  expanding_train: false

environment:
  initial_cash: 1000000.0
  transaction_cost: 0.001
  reward:
    return_weight: 1.0
    turnover_penalty: 0.05
    drawdown_penalty: 0.1

training:
  algo: ppo
  total_timesteps: 100000
  num_envs: 4
  seed: 42
