project:
  name: drl_thai_stock_large_scale_screening
  seed: 42

paths:
  raw_prices: data/raw/prices_real_ohlcv.csv
  # Use the readiness-certified artifact as the canonical runtime input. A
  # distinct missing primary path can be shadowed by stale remote files.
  features: data/processed/features_real_ohlcv_market.csv
  fallback_features_csv: data/processed/features_real_ohlcv_market.csv
  results_dir: results/large_scale_screening
  models_dir: models/large_scale_screening

data:
  source: yahoo_ohlcv
  tickers: [PTT.BK, AOT.BK, CPALL.BK, KBANK.BK, ADVANC.BK]
  start: "2021-01-01"
  end: "2024-12-31"

features:
  lookback: 30
  columns:
    - return_1d
    - return_5d
    - return_20d
    - volatility_20d
    - ma_ratio_10
    - ma_ratio_30
    - rsi_14
    - macd
    - bollinger_z
    - volume_ratio_20
    - market_return_1d
    - set_return_1d
    - set_return_5d
    - set_return_20d
    - set_volatility_20d
    - set_ma_ratio_20
    - macro_rate_change
    - sentiment_score

splits:
  train_fraction: 0.6
  validation_fraction: 0.2
  train_split: train
  eval_split: validation

environment:
  initial_cash: 1000000.0
  transaction_cost: 0.001
  slippage: 0.0
  reward:
    return_weight: 1.0
    turnover_penalty: 0.05
    drawdown_penalty: 0.1

training:
  algo: ppo
  total_timesteps: 20000
  num_envs: 8
  env_window_dates: 420
  vectorization_backend: subproc
  subproc_start_method: forkserver
  seed: 42
  checkpoint_freq: 20000
  checkpoint_keep_last: 1
  save_replay_buffer: false

screening:
  algorithms: [ppo, a2c, ddpg, td3, sac]
  trials_per_algorithm: 30
  total_timesteps: 20000
  objective_metric: sharpe
  top_n_per_algorithm: 5
  selected_algorithm_count: 2
